<main class="welcome-page">
  <div class="welcome-card">
    <div class="logo-placeholder">
      <img src="assets/logo_gpt.png" alt="Logo Quizu" />
        <img src="assets/pause.png" *ngIf="!isPause && !isBegin && isTimeRunning" alt="Pause" class="iconPlayPause" (click)="togglePause()"/>
        <img src="assets/play.png" *ngIf="isPause && !isBegin && !isTimeRunning" alt="Play" class="iconPlayPause" (click)="togglePause()"/>
    </div>

    <p class="eyebrow">Super! Grasz w "Słówka Literówka" =)</p>

    <button
      type="button"
      class="btn"
      (click)="getNewCategory()"
      [disabled]="isTimeRunning"
    >
      {{ isBegin ? "Start" : isTimeRunning || isPause ? "Gra w toku" : "Losuj kategorię" }}
    </button>

    <p class="letter" [class.red]="!isTimeRunning && !isBegin && !isPause" [class.grey]="isPause">
      {{ category }}
    </p>

    <p>
      {{ timeLeft | date: "mm:ss" : "UTC" }}
    </p>
    <div id="tabelka" *ngIf="!isPause">
      <div class="board">
        <div class="row" *ngFor="let row of rows">
          <div
            class="cell"
            *ngFor="let znak of row"
            [class.used]="znak.used"
            [class.notUsed]="!znak.used"
            (click)="markAsUsedChar(znak)"
          >
            {{ znak.name }}
          </div>
        </div>
      </div>
    </div>
    <div *ngIf="isPause">
      PAUZA
    </div>
  </div>
</main>
