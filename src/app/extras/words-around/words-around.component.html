<main class="welcome-page">
  <div class="welcome-card">
    <div class="logo-placeholder" aria-label="Miejsce na logo">
      <img
        src="assets/logo_gpt.png"
        alt="Logo Quizu"
        style="max-width: 100%; border-radius: 12px;"
      />
    </div>
    <p class="eyebrow">Super! Grasz w "Słówka Literówka" =)</p>
    <div (click)="getNewCategory()" >
        <button class="btn" style="margin: 0px; z-index: 999; width: 100%;" >
            {{isBegin? "Start": isTimeRunning ?  'Gra w toku': 'Losuj kategorię'}}
        </button>
    </div>
    <p class="letter" style="margin: 12px" [class.red]="!isTimeRunning &&  !isBegin">{{ category }}</p>
    <p>{{ timeLeft | date: "mm:ss" }}</p>
    <table>
      <tr *ngFor="let row of rows">
        <td
             (click)="znak.used = true; resetTimer();"
          *ngFor="let znak of row"
          [class.used]="znak.used"
          [class.notUsed]="!znak.used"
        >
        <span>
            {{ znak.name }}
        </span>
        </td>
      </tr>
    </table>
  </div>
</main>
