<main class="welcome-page">
  <div class="welcome-card">
    <div class="logo-placeholder">
      <img src="assets/logo_gpt.png" alt="Logo Quizu" />
    </div>

    <p class="eyebrow">Super! Grasz w "Słówka Literówka" =)</p>

    <button
      type="button"
      class="btn"
      (click)="getNewCategory()"
      [disabled]="isTimeRunning"
    >
      {{ isBegin ? "Start" : isTimeRunning ? "Gra w toku" : "Losuj kategorię" }}
    </button>

    <p class="letter" [class.red]="!isTimeRunning && !isBegin">
      {{ category }}
    </p>

    <p>
      {{ timeLeft | date: "mm:ss" : "UTC" }}
    </p>

    <table>
      <tr *ngFor="let row of rows">
        <td
        (click)="markAsUsed(znak)"
          *ngFor="let znak of row; trackBy: trackByIndex"
          [class.used]="znak.used"
          [class.notUsed]="!znak.used"
        >
          <span >
            {{ znak.name }}
          </span>
        </td>
      </tr>
    </table>
  </div>
</main>
