<main class="escape-room">
  <section class="puzzle" aria-labelledby="question">
    <div class="ambient-light" aria-hidden="true"></div>
    <p class="room-label">{{ currentQuestion.title }}</p>

    <p class="story" [innerHTML]="currentQuestion.story"></p>
    <div style="width: 100%; display: flex; justify-content: center; margin-top: 4px; position: relative;">
      <app-polibiusz *ngIf="currentQuestion.extraComponent === 'polibiusz'"></app-polibiusz>
      <app-klotski *ngIf="currentQuestion.extraComponent === 'klotski'" (isCompleteChange)="onKlotskiComplete($event)"></app-klotski>
      <app-audio *ngIf="currentQuestion.extraComponent === 'audio'" [source]="currentQuestion.media!"></app-audio>
      <img *ngIf="currentQuestion.extraComponent === 'image'" [src]="currentQuestion.media!" style="width: 90%;">
      <div>
        <app-panorama *ngIf="currentQuestion.extraComponent === 'sphere'" ></app-panorama>
        <br>
        <img *ngIf="currentQuestion.extraComponent === 'sphere'" src="../../assets/kartka.jpg" style="height: 100px; width: 100%;">
      </div>
      <div *ngIf="currentQuestion.icon" class="extraIcon">
        <img [src]="currentQuestion.icon">
      </div>
    </div>
    <ng-container>
      <h1 id="question" [innerHTML]="currentQuestion.question" style="text-decoration: none; color: white;"></h1>
      <p class="error-message" role="alert" aria-live="polite">
        <span *ngIf="showWrongAnswer">Zła odpowiedź</span>
      </p>

      <form class="answer-form" (ngSubmit)="checkAnswer()">
        <label *ngIf="currentQuestion.extraComponent !== 'klotski'" for="answer">Wpisz odpowiedź</label>
        <input *ngIf="currentQuestion.extraComponent !== 'klotski'"
          id="answer"
          name="answer"
          type="text"
          [(ngModel)]="answer"
          autocomplete="off"
          placeholder="..."
          required
          autofocus
        />
        <button type="submit" [disabled]="!answer.trim()">Kontynuuj</button>
      </form>
    </ng-container>
  </section>
</main>
